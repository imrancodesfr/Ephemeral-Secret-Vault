<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Ephemeral Vault</title>
  <link rel="stylesheet" href="js/style.css">
  <style>
    .auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 400px; }
    .auth-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 24px; color: var(--text); }
    .auth-brand svg { color: var(--accent); }
    .auth-tabs { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Ephemeral Vault
      </div>

      <div class="tabs auth-tabs">
        <button class="tab active" id="tab-register" onclick="showAuth('register')">Register</button>
        <button class="tab" id="tab-login" onclick="showAuth('login')">Sign in</button>
      </div>

      <div class="panel" id="panel-register">
        <h3>Create account</h3>
        <div class="form-group">
          <label for="reg-name">Name</label>
          <input id="reg-name" placeholder="Jane Doe" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="••••••••" />
          <p class="pick-note">Use 8–64 characters with at least one letter, one number, and one special character.</p>
        </div>
        <div class="form-group">
          <label for="reg-role">Role</label>
          <select id="reg-role">
            <option value="OWNER">Owner</option>
            <option value="GUARDIAN">Guardian</option>
            <option value="RECIPIENT">Recovery Recipient</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reg-wallet">Wallet address (optional)</label>
          <input id="reg-wallet" placeholder="0x..." />
        </div>
        <button class="btn full" onclick="register()">Register</button>
      </div>

      <div class="panel hidden" id="panel-login">
        <h3>Welcome back</h3>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" />
        </div>
        <button class="btn full" onclick="login()">Sign in</button>
      </div>

      <div id="result"></div>

      <p class="dim mt-16" style="text-align:center"><a href="index.html">Back to home</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script type="module">
    import { toast, getUser } from "./js/ui.js";

    window.__copy = (t) => { import('./js/ui.js').then((m) => m.copyText(t)); };

    if (getUser()) {
      window.location.href = 'dashboard.html';
    }

    function showAuth(tab) {
      const isRegister = tab === 'register';
      document.getElementById('panel-register').classList.toggle('hidden', !isRegister);
      document.getElementById('panel-login').classList.toggle('hidden', isRegister);
      document.getElementById('tab-register').classList.toggle('active', isRegister);
      document.getElementById('tab-login').classList.toggle('active', !isRegister);
    }
    window.showAuth = showAuth;

    function showRes(res, ok) {
      if (res.success) {
        toast(ok || 'Success', 'success');
      } else {
        toast(res.error || 'Error', 'error');
      }
      const box = document.getElementById('result');
      box.innerHTML = res.success
        ? '<p class="success">' + (ok || 'Success') + '</p>'
        : '<p class="error">' + (res.error || 'Error') + '</p>';
    }

    async function register() {
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      if (!name || !email || !password) {
        toast('Please fill in name, email and password', 'error');
        return;
      }
      toast('Creating your account…', 'info');
      const res = await api.post('/api/auth/register', {
        name,
        email,
        password,
        role: document.getElementById('reg-role').value,
        walletAddress: document.getElementById('reg-wallet').value || undefined,
      });
      if (res.success) {
        localStorage.setItem('user', JSON.stringify(res.user));
        localStorage.setItem('token', res.token);
        toast('Account created! Welcome, ' + res.user.name, 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
      } else {
        showRes(res, 'Account created!');
      }
    }
    window.register = register;

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      if (!email || !password) {
        toast('Please enter your email and password', 'error');
        return;
      }
      toast('Signing you in…', 'info');
      const res = await api.post('/api/auth/login', {
        email,
        password,
      });
      if (res.success) {
        localStorage.setItem('user', JSON.stringify(res.user));
        localStorage.setItem('token', res.token);
        toast('Signed in! Welcome back, ' + res.user.name, 'success');
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        setTimeout(() => { window.location.href = next && !next.includes('login.html') ? next : 'dashboard.html'; }, 600);
      } else {
        // Unified message: the server returns the same error whether the email
        // does not exist or the password is wrong, to prevent account probing.
        const msg = res.error || 'Sign in failed';
        const isLocked = /Too many failed attempts/.test(msg);
        toast(msg, 'error');
        document.getElementById('result').innerHTML =
          '<p class="error">' + msg + '</p>' +
          (isLocked ? '<p class="pick-note">Login temporarily locked after repeated failures.</p>' : '');
      }
    }
    window.login = login;
  </script>
</body>
</html>
